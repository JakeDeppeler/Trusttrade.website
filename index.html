<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trust Trade®: Find a Verified, Insured Local Tradie in Australia</title>
    <meta
      name="description"
      content="Find a tradie, done proper. Trust Trade routes you to verified, insured, licence-checked local tradies across Australia: electricians, plumbers, HVAC and more. Free to use."
    />
    <meta name="keywords" content="find a tradie, verified tradies, licensed electrician, licensed plumber, insured tradie Australia, local tradie app, hire a tradie" />
    <link rel="canonical" href="https://trusttrade.au/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f2a900" />
    <meta name="author" content="Trust Trade" />

    <!-- Preload the hero phone image so it starts before anything else.
         href MUST match the <img src> byte-for-byte (query string included) or the
         browser downloads it twice. Now that the landing page is prerendered, the JS no
         longer gates the paint — measurement showed the phone image is the mobile LCP
         (LCP lands ~0.7s after FCP), so preload it on ALL viewports at high priority. -->
    <link rel="preload" as="image" href="/assets/app-home.webp?v=2" fetchpriority="high" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trust Trade" />
    <meta property="og:title" content="Trust Trade®: Find a Verified, Insured Local Tradie" />
    <meta property="og:description" content="Find a tradie, done proper. Verified, insured, licence-checked local tradies across Australia. Free to use." />
    <meta property="og:url" content="https://trusttrade.au/" />
    <meta property="og:image" content="https://trusttrade.au/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trust Trade®: Find a Verified, Insured Local Tradie" />
    <meta name="twitter:description" content="Find a tradie, done proper. Verified, insured, licence-checked local tradies across Australia." />
    <meta name="twitter:image" content="https://trusttrade.au/og-image.png" />

    <!-- Fonts are self-hosted (public/fonts/*.woff2, @font-face in src/styles/fonts.css)
         so there's no Google round-trip / third-party connection. Archivo & the italic
         are variable fonts (one file each covers 100–900). Preload the two the hero
         headline needs so they arrive with the first paint; crossorigin is required even
         same-origin because fonts are always fetched anonymously (else double-download). -->
    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-italic.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured data: Organization + the mobile app + site search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://trusttrade.au/#org",
          "name": "Trust Trade",
          "url": "https://trusttrade.au/",
          "logo": "https://trusttrade.au/icon-512.png",
          "description": "Trust Trade connects Australian homeowners with verified, insured, licence-checked local tradies.",
          "areaServed": { "@type": "Country", "name": "Australia" }
        },
        {
          "@type": "WebSite",
          "@id": "https://trusttrade.au/#website",
          "url": "https://trusttrade.au/",
          "name": "Trust Trade",
          "publisher": { "@id": "https://trusttrade.au/#org" }
        },
        {
          "@type": "MobileApplication",
          "name": "Trust Trade",
          "operatingSystem": "iOS",
          "applicationCategory": "BusinessApplication",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "AUD" },
          "publisher": { "@id": "https://trusttrade.au/#org" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
