<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TrustTrade Tradie Dashboard</title>
<link rel="icon" href="/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/archivo.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-style:italic;font-weight:100 900;font-display:swap;src:url(/fonts/archivo-italic.woff2) format("woff2")}
/* ===== TrustTrade tradie dashboard: the phone app's design language =====
   The same palette, type and components as the tradie side of the app (and the
   admin console): soft mesh background, white 24px cards, Archivo 800 titles and
   numbers, fully rounded buttons, inputs and tags, amber primary actions, black
   selected segments. Pages mirror the app's tabs: Dashboard, Jobs, Inbox, My profile. */
:root{
 --f:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 --fd:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 --bg:#F2F2F0;
 --mesh:radial-gradient(62% 46% at 14% 8%,rgba(208,226,245,.34) 0%,rgba(208,226,245,0) 70%),radial-gradient(58% 42% at 93% 15%,rgba(250,219,150,.30) 0%,rgba(250,219,150,0) 72%),radial-gradient(74% 48% at 82% 88%,rgba(214,234,221,.30) 0%,rgba(214,234,221,0) 70%),radial-gradient(54% 38% at 4% 76%,rgba(250,230,183,.24) 0%,rgba(250,230,183,0) 70%);
 --panel:#FFFFFF;--panel2:#F7F6F3;--cream:#F4F2ED;--bar:#EFE7D6;
 --line:#E6E3DC;--line2:#F0EEE9;
 --ink:#101010;--body:#3E3A33;--ink2:#5E5A52;--mut:#716C63;--onink:#FAFAF8;
 --gold:#E9A21C;--goldd:#8A6A0B;--goldb:#FBEAC4;--goldt:#6B5208;
 --green:#1B6B45;--greenb:#E3F3E8;--greent:#3F6B53;
 --red:#CC3328;--redt:#B3261E;--redb:#FDE3E0;
 --blue:#2B5A8A;--blueb:#E8F0F8;
 --sh:0 2px 14px rgba(16,16,16,.06);
 --sh2:0 10px 30px rgba(16,16,16,.10);
 --shb:0 2px 10px rgba(16,16,16,.09);
 --sha:0 10px 26px -10px rgba(233,162,28,.95);
 --ring:0 0 0 4px rgba(233,162,28,.22);
 color-scheme:light;
}
html[data-theme="dark"]{
 --bg:#121212;
 --mesh:radial-gradient(56% 40% at 6% 0%,rgba(242,162,34,.13) 0%,rgba(242,162,34,0) 62%),radial-gradient(52% 36% at 98% 6%,rgba(110,132,235,.15) 0%,rgba(110,132,235,0) 60%),radial-gradient(58% 38% at 92% 64%,rgba(205,110,165,.09) 0%,rgba(205,110,165,0) 64%),radial-gradient(62% 42% at 0% 78%,rgba(56,180,148,.09) 0%,rgba(56,180,148,0) 64%);
 --panel:#1C1C1F;--panel2:#242428;--cream:#2B2B30;--bar:#2F2B24;
 --line:#36363C;--line2:#2A2A2F;
 --ink:#F4F4F7;--body:#DADAE0;--ink2:#BEBEC8;--mut:#90909B;--onink:#121212;
 --gold:#F2A222;--goldd:#F5BE68;--goldb:rgba(242,162,34,.17);--goldt:#F5BE68;
 --green:#3DBE7B;--greenb:rgba(34,168,99,.17);--greent:#7FD9A6;
 --red:#E8453C;--redt:#FF9B93;--redb:rgba(232,69,60,.17);
 --blue:#8FB4F0;--blueb:rgba(58,111,240,.2);
 --sh:0 8px 24px rgba(0,0,0,.28);
 --sh2:0 16px 38px rgba(0,0,0,.42);
 --shb:0 2px 10px rgba(0,0,0,.4);
 --sha:0 10px 26px -12px rgba(242,162,34,.7);
 --ring:0 0 0 4px rgba(242,162,34,.25);
 color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--f);font-size:14.5px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:var(--mesh);pointer-events:none;z-index:0}
.gate,.app{position:relative;z-index:1}
button,input,select,textarea{font-family:inherit;color:inherit}
::selection{background:rgba(233,162,28,.28)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── sign in + two-factor (NewLogin) ── */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.lcard{width:100%;max-width:420px;text-align:center}
.lbrand{display:inline-flex;align-items:center;gap:10px;margin-bottom:38px}
.lbrand img{width:40px;height:40px;border-radius:12px;box-shadow:var(--shb);display:block}
.lbrand b{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.035em}
.lbrand span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--goldt);background:var(--goldb);padding:4px 9px;border-radius:999px}
.lcard h1{font-family:var(--fd);font-size:46px;font-weight:800;letter-spacing:-.042em;line-height:.98;text-wrap:balance}
.lcard p{font-size:17px;line-height:1.45;color:var(--ink2);margin:14px auto 0;max-width:360px;text-wrap:balance}
.lform{margin-top:32px;display:flex;flex-direction:column;gap:12px}
.lcard input{width:100%;height:62px;border:0;border-radius:999px;background:var(--panel);box-shadow:0 2px 12px rgba(16,16,16,.07);padding:0 26px;font-size:17px;color:var(--ink);outline:none;transition:box-shadow .15s}
.lcard input::placeholder{color:#8C877D}
.lcard input:focus{box-shadow:0 2px 12px rgba(16,16,16,.07),0 0 0 2px var(--gold)}
.lcard input.code{text-align:center;font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:.42em;padding:0 0 0 .42em}
.lcard button{width:100%;height:62px;margin-top:22px;border:0;border-radius:999px;background:var(--gold);color:#101010;font-size:17.5px;font-weight:700;cursor:pointer;box-shadow:var(--sha);transition:transform .12s,filter .12s}
.lcard button:hover{filter:brightness(1.04)}
.lcard button:active{transform:scale(.985)}
.lcard button.ghost{width:auto;height:auto;margin:16px auto 0;padding:6px 8px;background:none;box-shadow:none;color:var(--ink);font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.lerr{color:var(--redt);font-size:14px;font-weight:600;margin-top:14px;min-height:20px}
.lnote{font-size:13.5px;color:var(--ink2);margin-top:18px}

/* ── shell: floating sidebar (the app's white nav bar) + content on the mesh ── */
.app{display:none;min-height:100vh}.app.on{display:flex;align-items:flex-start}
.side{position:sticky;top:16px;margin:16px 0 16px 16px;width:250px;flex-shrink:0;height:calc(100vh - 32px);background:var(--panel);border-radius:28px;box-shadow:var(--sh2);padding:18px 12px 12px;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
body.preview .side{top:62px;height:calc(100vh - 78px)}
.side::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:11px;overflow:hidden;flex-shrink:0;box-shadow:var(--shb)}
.brand .lg img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{display:block;font-family:var(--fd);font-weight:800;font-size:18.5px;letter-spacing:-.035em;line-height:1.05}
.brand .sub{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:2px}
.nv{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px 0 14px;border-radius:999px;color:var(--body);font-size:14.5px;font-weight:600;cursor:pointer;margin-bottom:2px;user-select:none;transition:background .12s,color .12s;flex-shrink:0}
.nv svg{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.nv:hover{background:var(--panel2);color:var(--ink)}
.nv.on{background:var(--goldb);color:var(--ink);font-weight:700}
.nv.on svg{opacity:1;stroke-width:2}
.nv .ct{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--cream);color:var(--ink2);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.nv .ct:empty{display:none}
.nv .ct.hot{background:var(--red);color:#fff}
.nv.on .ct{background:var(--panel)}
.nv.on .ct.hot{background:var(--red)}
.nvsep{height:1px;background:var(--line2);margin:10px 14px;flex-shrink:0}
.usercard{margin-top:auto;padding:10px;border-radius:20px;flex-shrink:0}
.uc-top{display:flex;align-items:center;gap:11px}
.usercard .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--onink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:14px;flex-shrink:0;background-size:cover;background-position:center}
.usercard .uc-t{flex:1;min-width:0}
.usercard .un{font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usercard .ur{font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc-acts{display:flex;gap:6px;margin-top:10px}
.uc-acts button{flex:1;height:34px;border:0;border-radius:999px;background:var(--cream);color:var(--ink2);font-size:12.5px;font-weight:700;cursor:pointer}
.uc-acts button:hover{color:var(--ink)}
.uc-acts button.out{color:var(--redt)}
.content{flex:1;min-width:0}
main{padding:34px 44px 90px;max-width:1180px;width:100%}

/* ── page headers ── */
h2{font-family:var(--fd);font-size:40px;font-weight:800;letter-spacing:-.042em;line-height:1.02;color:var(--ink)}
.subt{font-size:15.5px;line-height:1.45;color:var(--ink2);margin:8px 0 26px}
.phead{display:flex;align-items:flex-end;gap:12px 18px;flex-wrap:wrap;margin-bottom:26px}
.phead .pt{flex:1 1 360px;min-width:0}
.phead .pt .subt{margin-bottom:0}
.phead .pa{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:11px;margin:0 0 18px;font-size:14.5px;font-weight:600;color:var(--ink2);cursor:pointer;text-decoration:none}
.back .bk{width:40px;height:40px;border-radius:50%;background:var(--panel);box-shadow:var(--shb);display:grid;place-items:center;color:var(--ink);transition:transform .12s}
.back .bk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{color:var(--ink)}.back:hover .bk{transform:translateX(-2px)}
.h3{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 4px 12px}
.h3 h3{font-family:var(--fd);font-size:21px;font-weight:800;letter-spacing:-.03em}
.h3 a{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:26px 6px 10px}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--ink);color:var(--onink);font-size:14.5px;font-weight:700;line-height:1;white-space:nowrap;cursor:pointer;text-decoration:none;transition:transform .12s,filter .12s,background .12s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--gold);color:#101010;box-shadow:var(--sha)}
.btn.g:hover{filter:brightness(1.05)}
.btn.w{background:var(--panel);color:var(--ink);box-shadow:var(--shb)}
.btn.w:hover{background:var(--panel2);filter:none}
.btn.r{background:var(--panel);color:var(--redt);box-shadow:var(--shb)}
.btn.big{height:54px;padding:0 26px;font-size:16px}
.btn.sm{height:36px;padding:0 15px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.btn svg{width:17px;height:17px}

/* ── segments (the app's tabs) ── */
.tabs{display:flex;width:max-content;max-width:100%;gap:2px;padding:4px;margin:0 0 20px;background:var(--panel);border-radius:999px;box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs div{flex-shrink:0;height:40px;padding:0 20px;border-radius:999px;display:flex;align-items:center;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.tabs div:hover{background:var(--panel2)}
.tabs div.on{background:var(--ink);color:var(--onink);font-weight:700}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--cream);border-radius:999px}
.seg button{height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--onink)}

/* ── cards, stats ── */
.card{background:var(--panel);border-radius:24px;box-shadow:var(--sh);margin-bottom:14px}
.cpad{padding:20px 22px}
.ch{display:flex;align-items:center;gap:10px;padding:20px 22px 6px;font-size:17px;font-weight:700;letter-spacing:-.012em}
.ch .r{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 16px}
.kpi{background:var(--panel);border-radius:24px;box-shadow:var(--sh);padding:18px 20px;min-width:0}
.kpi.tap{cursor:pointer}
.kpi b{display:block;font-family:var(--fd);font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.kpi b.dn{color:var(--redt)}
.kpi .k{font-size:13.5px;font-weight:600;color:var(--ink2);margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2.wide{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.stack>*+*{margin-top:14px}

/* ── tags (the app's green / amber / red / blue / grey) ── */
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1;white-space:nowrap;background:#F2F0EB;color:#4E4A42;flex-shrink:0}
.pill.g{background:var(--greenb);color:var(--green)}.pill.a{background:var(--goldb);color:var(--goldt)}.pill.r{background:var(--redb);color:var(--redt)}.pill.b{background:var(--blueb);color:var(--blue)}
html[data-theme="dark"] .pill{background:var(--cream);color:var(--ink2)}
html[data-theme="dark"] .pill.g{background:var(--greenb);color:var(--green)}html[data-theme="dark"] .pill.a{background:var(--goldb);color:var(--goldt)}html[data-theme="dark"] .pill.r{background:var(--redb);color:var(--redt)}html[data-theme="dark"] .pill.b{background:var(--blueb);color:var(--blue)}

/* ── Dashboard: last 30 days (TDHome) ── */
.tds-top>span:first-child{font-size:15px;font-weight:600;color:var(--ink2)}
.needs{padding:2px 20px}
.need{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.need:last-child{border-bottom:0}
.need>i{width:10px;height:10px;border-radius:999px;background:#8C877D;flex-shrink:0}
.need>i.a{background:var(--gold)}.need>i.b{background:var(--blue)}.need>i.g{background:var(--green)}
.need .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.need .tx b{font-size:15.5px;font-weight:700}
.need .tx small{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px;height:16px;fill:none;stroke:#A8A398;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.need:hover .chev{stroke:var(--ink)}
.allgood{padding:26px 22px;text-align:center;color:var(--ink2);font-size:14.5px}
.allgood b{display:block;color:var(--ink);font-size:16px;margin-bottom:3px}
.state{padding:22px 24px;margin-bottom:16px}
.state h3{font-family:var(--fd);font-size:24px;font-weight:800;letter-spacing:-.035em;margin-top:12px}
.state p{font-size:15px;color:var(--ink2);margin-top:6px;max-width:620px}

/* ── Jobs: cards like the app's enquiry cards (TDEnquiries) ── */
.banner{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:22px;background:var(--goldb);cursor:pointer;margin-bottom:16px}
.banner .bic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.55);display:grid;place-items:center;color:var(--goldd);flex-shrink:0}
html[data-theme="dark"] .banner .bic{background:rgba(0,0,0,.2)}
.banner b{display:block;font-size:15px;font-weight:700;color:var(--goldt)}
.banner small{font-size:13px;color:var(--goldt);opacity:.85}
.banner .chev{margin-left:auto;stroke:var(--goldd)}
.banner .bic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lc{background:var(--panel);border-radius:24px;box-shadow:var(--sh);padding:16px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .12s,box-shadow .12s;min-width:0}
.lc:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.lc.new{box-shadow:0 0 0 2px var(--gold),var(--sh)}
.lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lc-who{display:flex;flex-direction:column;gap:1px;min-width:0}
.lc-who b{font-size:16.5px;font-weight:700}
.lc-who small{font-size:13px;color:var(--ink2)}
.lc-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lc-msg{font-size:14.5px;line-height:1.45;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.lc-go{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--goldd);margin-top:auto}
.lc-go .chev{stroke:var(--goldd)}
.none{grid-column:1/-1;padding:40px 20px;text-align:center;color:var(--ink2);background:var(--panel);border-radius:24px;box-shadow:var(--sh)}
.none b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.note{display:flex;align-items:flex-start;gap:10px;margin:18px 6px 0;font-size:14px;line-height:1.45;color:var(--greent)}
.note svg{width:18px;height:18px;margin-top:1px;fill:none;stroke:var(--green);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.note.warn{color:var(--goldt)}.note.warn svg{stroke:var(--goldd)}

/* ── An enquiry / a job (TDJob, TDJobDone) ── */
.cust{display:flex;align-items:center;gap:14px}
.cav{width:54px;height:54px;border-radius:999px;background:var(--goldb);color:var(--goldt);display:grid;place-items:center;font-family:var(--fd);font-size:20px;font-weight:800;flex-shrink:0;background-size:cover;background-position:center}
.cav.g{background-color:var(--greenb);color:var(--green)}
.cust .cn{flex:1;min-width:0}
.cust .cn b{display:block;font-family:var(--fd);font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.cust .cn small{display:block;font-size:14px;color:var(--ink2);margin-top:4px}
.steps{position:relative;display:flex;margin:22px 0 4px}
.steps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:11px;height:2px;background:var(--line)}
.steps::after{content:"";position:absolute;left:12.5%;top:11px;height:2px;width:calc(75% * var(--p,0));background:var(--green)}
.steps>span{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.steps i{width:24px;height:24px;border-radius:999px;background:var(--panel);border:2px solid #D5D1C8;display:grid;place-items:center}
html[data-theme="dark"] .steps i{border-color:var(--line)}
.steps span.on i{background:var(--green);border-color:var(--green)}
.steps i svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.steps b{font-size:12.5px;font-weight:500;color:var(--mut)}
.steps span.on b{font-weight:700;color:var(--ink)}
.job .cap{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.job .jt{font-size:18px;line-height:1.5;margin-top:6px;white-space:pre-line}
.job .jm{font-size:15px;line-height:1.55;color:var(--ink2);margin-top:8px;white-space:pre-line}
.job .amt{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.job .amt b{font-family:var(--fd);font-size:30px;font-weight:800;letter-spacing:-.04em}
.job .amt small{font-size:13px;color:var(--ink2)}
.job .where{display:block;margin-top:6px;font-size:14px;color:var(--ink2)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.photos span{position:relative;height:120px;border-radius:18px;background:var(--cream) center/cover no-repeat;cursor:zoom-in;overflow:hidden}
.photos span em{position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,16,16,.45);color:#fff;font-style:normal;font-size:22px;font-weight:700}
.nophoto{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
.nophoto .ic{width:42px;height:42px;border-radius:14px;background:var(--cream);display:grid;place-items:center;color:var(--ink2);flex-shrink:0}
.nophoto .tx{flex:1;min-width:0}
.nophoto b{display:block;font-size:15px}
.nophoto small{font-size:13px;color:var(--ink2)}
.facts{padding:4px 22px}
.facts>div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line2);font-size:15px}
.facts>div:last-child{border-bottom:0}
.facts>div>span{color:var(--ink2)}
.facts>div>b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.facts a{color:inherit}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.acts .two{display:flex;gap:10px}
.acts .two>*{flex:1}
.ai{background:#FBF4E4;border-radius:24px;padding:16px 20px;margin-bottom:14px}
html[data-theme="dark"] .ai{background:var(--goldb)}
.ai .aih{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--goldd)}
.ai p{font-size:14.5px;line-height:1.5;margin-top:6px;color:var(--body)}
.qsum{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:default}
.qsum .qi{width:42px;height:42px;border-radius:14px;background:var(--goldb);color:var(--goldd);display:grid;place-items:center;flex-shrink:0}
.qsum .tx{flex:1;min-width:0}
.qsum b{display:block;font-size:15.5px}
.qsum small{font-size:13px;color:var(--ink2)}
.qsum .v{font-family:var(--fd);font-size:22px;font-weight:800;letter-spacing:-.03em}
.open-card{text-align:center;padding:24px}
.open-card .oic{width:48px;height:48px;border-radius:999px;background:var(--goldb);color:var(--goldd);display:grid;place-items:center;margin:0 auto 10px}
.open-card b{font-size:17px}
.open-card p{font-size:14px;color:var(--ink2);margin-top:6px}

/* ── Conversation (ChatThread) ── */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px;position:sticky;top:24px;margin-bottom:0}
body.preview .chat{top:70px;height:calc(100vh - 196px)}
.chat .ch{padding-bottom:12px;border-bottom:1px solid var(--line2)}
.thread{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.bub{max-width:80%;padding:11px 16px;font-size:15px;line-height:1.42;white-space:pre-line;overflow-wrap:anywhere}
.bub.them{align-self:flex-start;background:var(--panel);box-shadow:0 1px 4px rgba(16,16,16,.06);border-radius:22px 22px 22px 6px}
.bub.me{align-self:flex-end;background:var(--gold);color:#101010;border-radius:22px 22px 6px 22px}
.aitag{font-size:11.5px;font-weight:600;color:var(--mut);margin:-2px 6px 2px}
.aitag.r{align-self:flex-end}
.day{align-self:center;font-size:12.5px;font-weight:600;color:var(--mut);margin:6px 0 2px}
.compose{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line2)}
.compose textarea{flex:1;min-height:48px;max-height:180px;padding:13px 18px;border:0;border-radius:24px;background:var(--panel2);font-size:15px;line-height:1.4;color:var(--ink);resize:none;outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.compose textarea:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.compose .send{width:48px;height:48px;border:0;border-radius:999px;background:var(--gold);color:#101010;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.compose .send svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cerr{padding:0 18px 10px;font-size:13px;font-weight:600;color:var(--redt)}
.cerr:empty{display:none}

/* ── Inbox (NewInbox) ── */
.msgs{display:flex;flex-direction:column;gap:10px;max-width:760px}
.mrow{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:var(--panel);border-radius:24px;box-shadow:var(--sh);cursor:pointer;transition:transform .12s,box-shadow .12s}
.mrow:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.mrow .cav{width:48px;height:48px;font-size:18px}
.mrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mrow .top b{font-size:16px;font-weight:600}
.mrow.unread .top b{font-weight:800}
.mrow .top span{font-size:13px;color:var(--ink2);flex-shrink:0}
.mrow .jb{font-size:12.5px;font-weight:700;color:var(--goldd)}
.mrow .pv{font-size:14.5px;color:var(--body);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mrow .dot{width:10px;height:10px;border-radius:999px;background:var(--gold);flex-shrink:0;margin-top:6px}

/* ── lists (Settings / Account rows) ── */
.rows{padding:0 20px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.row .ric{width:40px;height:40px;border-radius:12px;background:var(--cream);color:var(--ink2);display:grid;place-items:center;flex-shrink:0}
.row .ric.a{background:var(--goldb);color:var(--goldd)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .rt small{font-size:13px;color:var(--ink2)}
.row .rt b{font-size:15.5px;font-weight:700;overflow-wrap:anywhere}
.row .rt b.mu{color:var(--mut)}
.row .rv{font-size:14px;color:var(--ink2);text-align:right}

/* ── My profile (TDProfile) ── */
.hero{display:flex;align-items:center;gap:18px;padding:20px 22px}
.hlogo{width:72px;height:72px;border-radius:999px;background:var(--goldb) center/cover no-repeat;display:grid;place-items:center;color:var(--goldd);font-family:var(--fd);font-size:26px;font-weight:800;flex-shrink:0}
.hero .ht{flex:1;min-width:0}
.hero .ht b{display:block;font-family:var(--fd);font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.hero .ht small{display:block;font-size:14.5px;color:var(--ink2);margin-top:4px}
.hero .hr{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:600}
.hero .hr .st{color:var(--gold)}
.ptext{padding:18px 22px}
.ptext small{display:block;font-size:13px;color:var(--ink2)}
.ptext p{font-size:15.5px;line-height:1.55;margin-top:5px;white-space:pre-line}
.ptext p.mu{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chips span{background:var(--goldb);color:var(--goldt);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700}
.health{padding:20px 22px}
.health .hh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.health .hh b{display:block;font-size:17px;font-weight:700}
.health .hh small{display:block;font-size:13px;color:var(--ink2);margin-top:3px}
.health .hs{font-family:var(--fd);font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.health .hs small{font-family:var(--f);font-size:13px;font-weight:600;letter-spacing:0;color:var(--ink2)}
.health .hbar{height:9px;border-radius:999px;background:var(--bar);overflow:hidden;margin:16px 0 8px}
.health .hbar i{display:block;height:100%;border-radius:999px}
.health .hg{font-size:13.5px;font-weight:700}
.health .qw{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:18px 0 2px}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.hrow.tap{cursor:pointer}
.hrow .pts{min-width:46px;padding:5px 8px;border-radius:999px;background:var(--goldb);color:var(--goldt);font-size:12.5px;font-weight:800;text-align:center;flex-shrink:0}
.hrow .tx{flex:1;min-width:0}
.hrow .tx b{display:block;font-size:15px;font-weight:600}
.hrow .tx small{font-size:12.5px;color:var(--ink2)}
.hrow .app{font-size:12px;font-weight:700;color:var(--mut)}

/* ── forms (TDProfileEdit) ── */
.form{padding:22px}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin:0 0 7px 4px}
.field input,.field textarea,.field select{width:100%;height:52px;padding:0 20px;border:0;border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:15.5px;color:var(--ink);outline:none;transition:box-shadow .12s,background .12s}
.field textarea{height:auto;min-height:120px;padding:15px 20px;border-radius:24px;line-height:1.5;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{background:var(--panel);box-shadow:inset 0 0 0 2px var(--gold)}
.field input[readonly]{color:var(--ink2);background:var(--cream);box-shadow:none}
.field .hint{display:block;font-size:13px;color:var(--ink2);margin:7px 4px 0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.fgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) 130px minmax(0,1fr) 44px;gap:8px;margin-bottom:8px}
.srow input{height:48px;padding:0 16px;border:0;border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;color:var(--ink);outline:none;min-width:0}
.srow input:focus{background:var(--panel);box-shadow:inset 0 0 0 2px var(--gold)}
.rm{width:44px;height:48px;border:0;border-radius:999px;background:var(--redb);color:var(--redt);display:grid;place-items:center;cursor:pointer}
.rm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border:1.5px dashed var(--line);border-radius:999px;background:none;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer}
.addrow:hover{border-color:var(--gold)}
.ferr{color:var(--redt);font-size:14px;font-weight:600;margin:4px 4px 12px}
.ferr:empty{display:none}
.fok{color:var(--green);font-size:14px;font-weight:700;margin:4px 4px 12px}
.fok:empty{display:none}
.fbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.qline{display:grid;grid-template-columns:minmax(0,1fr) 150px auto 44px;gap:8px;align-items:center;padding:10px;border-radius:22px;background:var(--panel2);margin-bottom:8px}
.qline input{height:46px;padding:0 16px;border:0;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;color:var(--ink);outline:none;min-width:0}
.qline input:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.gst{height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--panel);box-shadow:var(--shb);font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.gst.on{background:var(--goldb);color:var(--goldt);box-shadow:none}
.totals{margin:18px 4px 6px}
.totals>div{display:flex;justify-content:space-between;padding:4px 0;font-size:14.5px;color:var(--ink2)}
.totals>div b{color:var(--ink);font-variant-numeric:tabular-nums}
.totals>div.grand{margin-top:8px;padding-top:12px;border-top:1px solid var(--line2);color:var(--ink);font-weight:700;font-size:16px;align-items:baseline}
.totals>div.grand b{font-family:var(--fd);font-size:34px;font-weight:800;letter-spacing:-.04em}

/* ── hours ── */
.dayrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.dayrow:last-child{border-bottom:0}
.dayrow>b{width:92px;font-size:15.5px}
.dayrow .times{display:flex;align-items:center;gap:8px}
.dayrow input[type=time]{height:44px;padding:0 14px;border:0;border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;color:var(--ink);outline:none}
html[data-theme="dark"] .dayrow input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}
.dayrow .times span{color:var(--ink2);font-size:14px}
.dayrow .em{font-size:14px;color:var(--ink2)}

/* ── gallery, reviews, tables ── */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:20px}
.gal span{aspect-ratio:1;border-radius:18px;background:var(--cream) center/cover no-repeat;cursor:zoom-in}
.rsum{display:flex;align-items:center;gap:22px;padding:22px 24px}
.rsum .big{font-family:var(--fd);font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:1}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:17px;height:17px;fill:#DCD7CC;stroke:none}
.stars svg.on{fill:var(--gold)}
html[data-theme="dark"] .stars svg{fill:#3A3A40}
html[data-theme="dark"] .stars svg.on{fill:var(--gold)}
.rev{padding:18px 22px}
.rev .rh{display:flex;align-items:center;gap:12px}
.rev .rh .cav{width:40px;height:40px;font-size:15px}
.rev .rh .tx{flex:1;min-width:0}
.rev .rh b{display:block;font-size:15.5px}
.rev .rh small{font-size:13px;color:var(--ink2)}
.rev p{font-size:15px;line-height:1.55;margin-top:10px;color:var(--body)}
.reply{margin-top:12px;padding:12px 16px;border-radius:18px;background:var(--panel2);font-size:14px;line-height:1.5}
.reply b{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:2px}
.rbox{margin-top:12px}
.rbox textarea{display:block;width:100%;min-height:80px;padding:13px 18px;border:0;border-radius:20px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;line-height:1.5;color:var(--ink);resize:vertical;outline:none}
.rbox textarea:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.rbox .fbar{margin-top:10px}
.torev{display:flex;align-items:center;gap:14px;padding:16px 20px;box-shadow:0 0 0 2px var(--gold),var(--sh)}
.torev .tx{flex:1;min-width:0}
.torev b{display:block;font-size:16px}
.torev small{font-size:13px;color:var(--ink2)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:14px 22px 10px;white-space:nowrap}
td{padding:14px 22px;border-top:1px solid var(--line2);font-size:14.5px;vertical-align:middle}
tbody tr.tap{cursor:pointer}
tbody tr.tap:hover td{background:var(--panel2)}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.mut{color:var(--mut)}.sub2{color:var(--ink2)}
.empty{padding:40px 22px;text-align:center;color:var(--ink2);font-size:14.5px}
.shim{height:14px;margin:18px 22px;border-radius:999px;background:linear-gradient(90deg,var(--line2) 25%,var(--cream) 37%,var(--line2) 63%);background-size:400% 100%;animation:shim 1.3s ease infinite}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
.qr{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:16px;display:grid;place-items:center;margin:20px auto 14px;width:max-content}
.qr svg,.qr img{width:190px;height:190px;display:block}
.secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;background:var(--panel2);border-radius:999px;padding:9px 16px;display:inline-block;word-break:break-all;letter-spacing:.04em}
.codein{max-width:260px;margin:18px auto 0}
.codein input{width:100%;height:58px;border:0;border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);text-align:center;font-family:var(--fd);font-size:24px;font-weight:800;letter-spacing:.4em;padding-left:.4em;color:var(--ink);outline:none}
.codein input:focus{box-shadow:inset 0 0 0 2px var(--gold)}

/* ── sheets (modals), toasts, photo viewer ── */
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(16,16,16,.30);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ov.on{display:flex}
.modal{width:100%;max-width:460px;max-height:calc(100vh - 48px);overflow:auto;background:var(--panel);border-radius:28px;box-shadow:0 30px 80px -20px rgba(16,16,16,.35);padding:28px}
.modal h3{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.modal p{font-size:15px;line-height:1.5;color:var(--ink2);margin-top:8px}
.modal textarea{display:block;width:100%;min-height:90px;margin-top:16px;padding:14px 18px;border:0;border-radius:20px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;line-height:1.5;color:var(--ink);resize:vertical;outline:none}
.modal textarea:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.reasons{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.reasons button{height:52px;border:0;border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;padding:0 22px}
.reasons button:hover{box-shadow:inset 0 0 0 2px var(--gold)}
.pickstars{display:flex;gap:6px;justify-content:center;margin:20px 0 4px}
.pickstars svg{width:40px;height:40px;fill:#DCD7CC;cursor:pointer;transition:transform .1s}
.pickstars svg.on{fill:var(--gold)}
.pickstars svg:hover{transform:scale(1.08)}
.toastx{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;max-width:calc(100vw - 40px);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#101010;border:1px solid rgba(16,16,16,.09);border-radius:999px;padding:13px 22px;font-size:14px;font-weight:600;box-shadow:0 14px 40px -6px rgba(16,16,16,.30)}
html[data-theme="dark"] .toastx{background:rgba(44,44,46,.92);border-color:rgba(255,255,255,.08);color:#F4F4F7}
.lbx{position:fixed;inset:0;z-index:9999;background:rgba(14,13,11,.92);display:flex;align-items:center;justify-content:center;padding:36px;cursor:zoom-out}
.lbx img{max-width:94vw;max-height:92vh;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6);object-fit:contain}
.lbx .nx{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:26px;cursor:pointer}
.lbx .nx.l{left:22px}.lbx .nx.r{right:22px}
.pvbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 20px;background:#101010;color:#fff;font-size:13.5px;font-weight:600}
.pvbar .tag{background:var(--gold);color:#101010;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.pvbar button{margin-left:auto;height:32px;padding:0 15px;border:0;border-radius:999px;background:#fff;color:#101010;font-size:13px;font-weight:700;cursor:pointer}

/* ── desktop layouts: the Dashboard overview, and Jobs and Inbox as a list beside the open item ── */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi2{background:var(--panel);border-radius:24px;box-shadow:var(--sh);padding:18px 22px;min-width:0}

async function verifyMfaLogin(){$('e-mfa').textContent='';

 if(code.length<6){$('e-mfa').textContent='Enter the 6-digit code';return;}

  const f=(factors&&factors.totp||[])[0]; if(!f){route();return;}

  route();

async function workData(){

  sb.from('bookings').select('*').eq('tradie_auth_id',ME.id).order('created_at',{ascending:false}).limit(300),

  sb.from('customer_reviews').select('booking_id').eq('from_tradie_auth_id',ME.id)]);
 if(er.error) throw er.error;
 const E=er.data||[],B=br.data||[],Q=qr.data||[],I=ir.data||[],rated=new Set((cr.data||[]).map(r=>r.booking_id));
 const ids=[...new Set(B.map(b=>b.customer_id).filter(Boolean))];

 const qById={};Q.forEach(q=>qById[q.id]=q);
 // a job's own quote: linked since 27 Sep, older jobs by their enquiry
 const qOf=b=>(b.quote_id&&qById[b.quote_id])||(b.enquiry_id&&Q.find(x=>x.enquiry_id===b.enquiry_id&&x.status==='accepted'))||null;
 const whoOf=b=>{const n=(P[b.customer_id]||{}).name||(qOf(b)||{}).customer_name||(b.enquiry_id&&(E.find(x=>x.id===b.enquiry_id)||{}).from_name);return n?shortName(n):'Customer';};
 return {E,B,Q,I,P,rated,qOf,whoOf};
}
function leadShortUrg(u){const v=String(u||'').toLowerCase();
 if(!v) return null;
 if(v==='emergency'||v==='today'||v==='high') return ['Emergency','r'];
 if(/urgent|asap/.test(v)) return ['Urgent','r'];
 if(/1.?2|few days/.test(v)) return ['1–2 days','a'];
 if(/week/.test(v)) return ['This week','a'];
 if(/month/.test(v)) return ['This month','a'];
 if(/quote|no rush|low|future/.test(v)) return ['Flexible','n'];
 if(v==='normal'||v==='flexible') return ['Flexible','n'];
 return [String(u),'a'];}
function urgText(u){const v=String(u||'').toLowerCase();return v==='emergency'?'Emergency, today':v==='high'?'Urgent':v==='normal'?'Flexible':v==='low'?'No rush':String(u||'');}
let BOOKED_ENQ=new Set();
function leadStatus(e){
 if(e.stage==='declined') return ['Declined','n'];
 if(e.status==='completed'||e.job_complete) return ['Done','g'];
 if(BOOKED_ENQ.has(e.id)) return ['Booked','b'];
 if(e.status==='new') return ['New','a'];
 if(e.status==='replied'||e.first_response_at) return ['Replied','b'];
 return ['Read','b'];}
function whenLead(iso){const d=new Date(iso);if(isNaN(d))return '';const now=new Date();
 const t=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).replace(/\s/g,'').toLowerCase();
 if(d.toDateString()===now.toDateString())return 'Today, '+t;
 const y=new Date(now);y.setDate(now.getDate()-1);if(d.toDateString()===y.toDateString())return 'Yesterday';
 return dayShort(d);}
// "Needs you" reads like the app: the job in a few words, never a clipped sentence.
function needJob(msg){const all=String(msg||'').replace(/\s+/g,' ').trim();if(!all)return '';
 let t=all.split(/\s[—–-]\s|[.!?;:,](?:\s|$)/)[0].trim()||all;
 if(t.length>40)t=t.slice(0,40).replace(/\s+\S*$/,'');
 return t.replace(/[\s,;:.!?…—–-]+$/,'');}
function deriveJobTitle(e){const all=String((e&&e.message)||'').replace(/\s+/g,' ').trim();if(!all)return '';
 let t=all.split(/\s[—–-]\s|[.!?;:](?:\s|$)/)[0].trim()||all;
 if(t.length>60)t=t.slice(0,60).replace(/\s+\S*$/,'');
 return t.replace(/[\s,;:.!?…—–-]+$/,'');}

  <div class="lc-go"><span>${st[0]==='Done'?'View job':st[0]==='Booked'?'Open job':'Open enquiry'}</span>${ICH}</div></div>`;
}

}

/* ═════ JOBS: every enquiry, the new ones, booked jobs, done jobs ═════
   On a desktop, one full-width list (customer, job, date, urgency, status, price); a row
   opens the job on its own full-screen page with the chat beside it. In a narrow window
   it's the app's cards (TDEnquiries), each opening the same page. */
let JSEG='all', JW=null, JQ='', LASTLIST='jobs';
const DESK=()=>window.innerWidth>=1100;
const ISEARCH='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
function jobsFigures(W){
 const booked=W.B.filter(b=>['requested','confirmed'].includes(b.status));
 const pendingQ=W.Q.filter(q=>['sent','viewed'].includes(q.status)), unpaid=W.I.filter(i=>['sent','overdue'].includes(i.status));
 const pipeline=pendingQ.reduce((a,q)=>a+ +(q.total_inc_gst||0),0)+booked.reduce((a,b)=>{const q=W.qOf(b);return a+(q?+q.total_inc_gst||0:0);},0);
 return {booked,pendingQ,unpaid,pipeline,unpaidAmt:unpaid.reduce((a,i)=>a+ +(i.total||0),0)};
}
// One status for a job, the same on the Jobs list and in the Inbox.
function jobStatus(e,q,bk){
 if(e.stage==='declined') return ['Declined','n','declined'];
 if((bk&&bk.status==='completed')||e.status==='completed'||e.job_complete) return ['Done','g','done'];
 if((bk&&['confirmed','requested'].includes(bk.status))||(q&&q.status==='accepted')) return ['Booked','b','booked'];
 if(q&&['sent','viewed'].includes(q.status)) return ['Quoted','q','quoted'];
 if(e.status==='new') return ['New','a','new'];
 if(e.status==='replied'||e.first_response_at) return ['Replied','n','replied'];
 return ['Read','n','read'];
}
// The latest quote and the live (or finished) booking for each enquiry. Quotes come newest first.
function enqLinks(Q,B){
 const q={}, b={};
 (Q||[]).forEach(x=>{ if(x.enquiry_id&&x.status!=='draft'&&!q[x.enquiry_id]) q[x.enquiry_id]=x; });
 (B||[]).forEach(x=>{ if(!x.enquiry_id||x.status==='cancelled') return; const cur=b[x.enquiry_id];
  if(!cur||(x.status==='completed'&&cur.status!=='completed')||(['confirmed','requested'].includes(x.status)&&!['confirmed','requested','completed'].includes(cur.status))) b[x.enquiry_id]=x; });
 return {q,b};
}

let QLINES=[];
function qSum(){let sub=0,gst=0;QLINES.forEach(l=>{const p=parseFloat(String(l[1]).replace(/[^0-9.]/g,''))||0;if(!p)return;if(l[3]){const base=Math.round(p/1.1*100)/100;sub+=base;gst+=(p-base);}else{sub+=p;gst+=p*0.1;}});sub=Math.round(sub*100)/100;gst=Math.round(gst*100)/100;return{sub,gst,tot:Math.round((sub+gst)*100)/100};}

function qAddLine(){QLINES.push(['','','',false]);qRenderLines();const ins=document.querySelectorAll('#qlines .qline:last-child input');if(ins[0])ins[0].focus();}

async function sendQuote(){
 if(!LEAD)return;const err=$('q_err');err.textContent='';
 const title=(val('q_title')||'').trim();if(!title){err.textContent='Add a job title.';return;}
 const {sub,gst,tot}=qSum();if(tot<=0){err.textContent='Add at least one priced line.';return;}
 const startTxt=(val('q_start')||'').trim(),warranty=(val('q_warranty')||'').trim();
 const validDays=parseInt(String(val('q_valid')||'').replace(/[^0-9]/g,''),10)||7;
 const scopeLines=QLINES.filter(l=>String(l[0]).trim()).map(l=>{const p=parseFloat(String(l[1]).replace(/[^0-9.]/g,''))||0;return '• '+String(l[0]).trim()+(p?(' ($'+p.toLocaleString()+(l[3]?' inc GST':'')+')'):'');});
 const terms=[];if(startTxt)terms.push('Can start: '+startTxt);terms.push('Valid '+validDays+' days');if(warranty)terms.push('Warranty: '+warranty);

const STOCK=/(^|\/\/)([a-z0-9-]+\.)*(unsplash\.com|pexels\.com|pixabay\.com|istockphoto\.com|shutterstock\.com|gettyimages\.)/i;
const listingPhotos=l=>(Array.isArray(l.photos)?l.photos:[]).filter(u=>u&&!STOCK.test(String(u)));
// priced_services comes in two shapes: [{name,items:[…]}] sections, or flat [{name,unit,price}].
function pricedRows(l){const out=[];(Array.isArray(l.priced_services)?l.priced_services:[]).forEach(x=>{
  if(x&&Array.isArray(x.items))x.items.forEach(it=>out.push({name:it.name||x.name,desc:it.desc||it.detail||'',price:it.price}));
  else if(x&&x.name)out.push({name:x.name,desc:x.desc||x.detail||'',price:x.price});});
 const seen=new Set(out.map(r=>String(r.name).toLowerCase()));
 (Array.isArray(l.services)?l.services:[]).forEach(s=>{const n=String(s||'').trim();if(n&&!seen.has(n.toLowerCase())){out.push({name:n,desc:'',price:null});seen.add(n.toLowerCase());}});
 return out.filter(r=>r.name);}
function hoursWords(l){
 const h=(l.business_hours&&typeof l.business_hours==='object'&&Object.keys(l.business_hours).length)?l.business_hours:l.opening_hours;
 if(!h||typeof h!=='object')return [];
 const order=['mon','tue','wed','thu','fri','sat','sun'],lbl={mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat',sun:'Sun'};
 const t=x=>{const m=String(x||'').match(/^(\d{1,2}):(\d{2})\s*(am|pm)?/i);if(!m)return String(x||'');let hh=+m[1];if(m[3]){if(/pm/i.test(m[3])&&hh<12)hh+=12;if(/am/i.test(m[3])&&hh===12)hh=0;}return (((hh+11)%12)+1)+(+m[2]?':'+m[2]:'')+(hh<12?'am':'pm');};
 const day=d=>{const v=h[d];if(!v)return 'closed';if(Array.isArray(v))return (v[0]||v[1])?t(v[0])+' to '+t(v[1]):'closed';
  if(v.mode==='closed')return 'closed';if(v.mode==='emergency'||v.emergencyOnly)return 'emergencies only';
  if(v.open||v.close){if(v.open==='00:00'&&/^(23:59|24:00)/.test(v.close||''))return 'open 24 hours';return t(v.open)+' to '+t(v.close);}return 'closed';};
 const vals=order.map(day);if(vals.every(v=>v==='open 24 hours'))return ['Open 24/7'];
 const parts=[];let i=0;while(i<7){let j=i;while(j+1<7&&vals[j+1]===vals[i])j++;if(vals[i]!=='closed')parts.push((i===j?lbl[order[i]]:lbl[order[i]]+' to '+lbl[order[j]])+(i===j?' ':', ')+vals[i]);i=j+1;}
 return parts;}

 return `<div class="card health"><div class="hh"><div><b>Account health</b><small>The higher your score, the more likely you get hired.</small></div><div class="hs" style="color:${col}">${score}<small>/100</small></div></div>

  ${todo.length?`<div class="qw">Quick wins</div>${todo.map(i=>`<div class="hrow${i.fn?' tap':''}"${i.fn?` onclick="${i.fn}"`:''}><span class="pts">+${i.pts}</span><span class="tx"><b>${i.label}</b><small>${i.sub}</small></span>${i.fn?ICH:'<span class="app">In the app</span>'}</div>`).join('')}`:'<p class="sub2" style="margin-top:12px">Your profile is complete. Nicely done.</p>'}</div>`;
}

  </div></div>`;
 svcRender();
}
async function saveProfile(){
 const err=$('p_err'),ok=$('p_ok');err.textContent='';ok.textContent='';
 const name=val('p_name').trim(), email=val('p_email').trim(), phone=val('p_phone').trim();
 if(!name){err.textContent='Add your business name.';return;}
 if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='That email doesn’t look right.';return;}
 if(phone&&phone.replace(/\D/g,'').length<8){err.textContent='That phone number looks too short.';return;}
 const num=id=>{const v=parseFloat(String(val(id)).replace(/[^0-9.]/g,''));return Number.isFinite(v)?v:null;};
 // services + starting prices: the same shape the app's Services & pricing screen saves
 const rows=SVC.filter(r=>String(r.name||'').trim());
 const items=rows.map(r=>{const raw=String(r.price==null?'':r.price).trim(),n=parseFloat(raw.replace(/[^0-9.]/g,''));return {from:true,name:String(r.name).trim(),price:raw&&Number.isFinite(n)?n:null,desc:String(r.desc||'').trim()};});
 const upd={name,phone:phone||null,email:email||null,website:val('p_web').trim()||null,description:val('p_desc').trim()||null,
  services:items.map(i=>i.name),priced_services:items.length?[{name:'Services',items}]:[],
  hourly_rate:num('p_rate'),call_out_fee:num('p_call'),service_radius_km:num('p_rad')!=null?Math.round(num('p_rad')):null};
 const btn=$('p_save');btn.disabled=true;
 const {error}=await sb.from('listings').update(upd).eq('id',LST.id);
 btn.disabled=false;
 if(error){err.textContent=error.message||'That didn’t save. Try again.';return;}
 Object.assign(LST,upd);paintWho();ok.textContent='Saved. Customers see the changes straight away.';
}

/* ═════ AVAILABILITY ═════ */
// Hours live in business_hours (what customers see): {open:'07:00',close:'17:00'}, or
// {mode:'emergency'} for emergencies only, or {mode:'closed'}.
let HRS={};
function dayState(v){if(!v)return {m:'closed',o:'07:00',c:'17:00'};
 const to24=x=>{const m=String(x||'').match(/^(\d{1,2}):(\d{2})\s*(am|pm)?/i);if(!m)return '';let hh=+m[1];if(m[3]){if(/pm/i.test(m[3])&&hh<12)hh+=12;if(/am/i.test(m[3])&&hh===12)hh=0;}return String(hh).padStart(2,'0')+':'+m[2];};
 if(Array.isArray(v))return (v[0]||v[1])?{m:'open',o:to24(v[0])||'07:00',c:to24(v[1])||'17:00'}:{m:'closed',o:'07:00',c:'17:00'};
 if(v.mode==='emergency'||v.emergencyOnly)return {m:'emergency',o:'07:00',c:'17:00'};
 if(v.mode==='closed'||v.closed)return {m:'closed',o:'07:00',c:'17:00'};
 if(v.open||v.close)return {m:'open',o:to24(v.open)||'07:00',c:to24(v.close)||'17:00'};
 return {m:'closed',o:'07:00',c:'17:00'};}
function pHours(){const t=LST;
 const src=(t.business_hours&&typeof t.business_hours==='object'&&Object.keys(t.business_hours).length)?t.business_hours:(t.opening_hours||{});
 HRS={};DAYS.forEach(([k])=>{HRS[k]=dayState(src[k]||src[k[0].toUpperCase()+k.slice(1)]);});
 $('main').innerHTML=`<div class="phead"><div class="pt"><h2>Availability</h2><div class="subt">Your usual hours. Customers see these on your profile, and they drive your “Open now” badge.</div></div></div>
  <div class="card cpad" style="max-width:820px"><div id="hrows"></div><div class="ferr" id="h_err" style="margin-top:12px"></div><div class="fok" id="h_ok" style="margin-top:12px"></div><div class="fbar" style="margin-top:14px"><button class="btn g big" id="h_save" onclick="saveHours()">Save hours</button></div></div>`;
 hPaint();
}
function hPaint(){$('hrows').innerHTML=DAYS.map(([k,l])=>{const d=HRS[k];const b=(m,t)=>`<button class="${d.m===m?'on':''}" onclick="HRS.${k}.m='${m}';hPaint()">${t}</button>`;
 return `<div class="dayrow"><b>${l}</b><span class="seg">${b('open','Open')}${b('emergency','Emergencies')}${b('closed','Closed')}</span>${d.m==='open'?`<span class="times"><input type="time" value="${esc(d.o)}" onchange="HRS.${k}.o=this.value"><span>to</span><input type="time" value="${esc(d.c)}" onchange="HRS.${k}.c=this.value"></span>`:d.m==='emergency'?'<span class="em">Emergency call-outs only</span>':''}</div>`;}).join('');}
async function saveHours(){
 const err=$('h_err'),ok=$('h_ok');err.textContent='';ok.textContent='';
 const bh={};
 for(const [k,l] of DAYS){const d=HRS[k];
  if(d.m==='open'){if(!d.o||!d.c){err.textContent='Set both times for '+l+'.';return;}bh[k]={open:d.o,close:d.c};}
  else bh[k]={mode:d.m};}
 const btn=$('h_save');btn.disabled=true;
 const {error}=await sb.from('listings').update({business_hours:bh}).eq('id',LST.id);
 btn.disabled=false;
 if(error){err.textContent=error.message||'That didn’t save. Try again.';return;}
 LST.business_hours=bh;ok.textContent='Saved. Customers see your new hours straight away.';
}

/* ═════ SECURITY / 2FA (Supabase TOTP MFA) ═════ */
let MFA_ENROLL=null;
async function pSecurity(){loading('Security');
 let totp=[];
 try{const {data}=await sb.auth.mfa.listFactors();totp=((data&&data.totp)||[]).filter(f=>f.status==='verified');}catch(e){}
 if(totp.length){
  $('main').innerHTML=`<div class="phead"><div class="pt"><h2>Security</h2><div class="subt">Two-factor authentication keeps your account safe.</div></div></div>
   <div class="card cpad" style="max-width:640px"><span class="pill g">Two-factor is on</span><p class="sub2" style="font-size:15px;margin:12px 0 18px">You’ll be asked for a 6-digit code from your authenticator app each time you sign in on the web.</p><button class="btn r" onclick="removeMfa('${totp[0].id}')">Turn off two-factor</button></div>`;
  return;}
 $('main').innerHTML=`<div class="phead"><div class="pt"><h2>Security</h2><div class="subt">Add two-factor authentication for an extra layer of security.</div></div></div>
  <div class="card cpad" style="max-width:640px"><p style="font-size:16px;font-weight:600">Protect your account with a 6-digit code from an authenticator app.</p><p class="sub2" style="font-size:14.5px;margin:6px 0 18px">Works with Google Authenticator, Authy, 1Password, Microsoft Authenticator and more.</p><button class="btn g" onclick="startMfa()">Set up two-factor</button></div>`;
}
async function startMfa(){
 try{const {data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'TrustTrade '+new Date().toISOString().slice(0,10)});
  if(error){toast(error.message);return;}
  MFA_ENROLL=data;
  const qr=(data.totp&&data.totp.qr_code)||'';
  const img=/^data:/.test(qr)?`<img src="${qr}" alt="Two-factor QR code">`:(qr.indexOf('<svg')>=0?qr:'');
  $('main').innerHTML=`<div class="phead"><div class="pt"><h2>Set up two-factor</h2><div class="subt">Scan the code with your authenticator app, then enter the 6-digit code it shows.</div></div></div>
   <div class="card cpad" style="max-width:640px;text-align:center">
    ${img?`<div class="qr">${img}</div>`:''}
    <div class="sub2" style="font-size:13px;margin:4px 0 8px">Can’t scan it? Enter this key instead:</div>
    <div class="secret">${esc((data.totp&&data.totp.secret)||'')}</div>
    <div class="codein"><input id="mfa_code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" onkeydown="if(event.key==='Enter')confirmMfa()"></div>
    <div class="ferr" id="e-mfaset" style="margin-top:12px"></div>
    <div class="fbar" style="justify-content:center;margin-top:16px"><button class="btn g" onclick="confirmMfa()">Verify and turn on</button><button class="btn w" onclick="go('security')">Cancel</button></div>
   </div>`;
 }catch(e){toast(e.message||'Could not start two-factor setup');}
}
async function confirmMfa(){
 if(!MFA_ENROLL)return;const box=$('e-mfaset');box.textContent='';
 const code=(val('mfa_code')||'').replace(/\s/g,'');
 if(code.length<6){box.textContent='Enter the 6-digit code';return;}
 try{const {data:ch,error:ce}=await sb.auth.mfa.challenge({factorId:MFA_ENROLL.id});
  if(ce){box.textContent=ce.message;return;}
  const {error:ve}=await sb.auth.mfa.verify({factorId:MFA_ENROLL.id,challengeId:ch.id,code});
  if(ve){box.textContent=ve.message||'Wrong code, try again';return;}
  MFA_ENROLL=null;go('security');
 }catch(e){box.textContent=e.message;}
}
async function removeMfa(id){
 if(!confirm('Turn off two-factor? Your account will no longer ask for a code at sign-in.'))return;
 try{const {error}=await sb.auth.mfa.unenroll({factorId:id});if(error){toast(error.message);return;}go('security');}catch(e){toast(e.message);}
}

/* ═════ Admin preview mode ═════
   An admin can open /dashboard?preview=<listing_id> to see any tradie's dashboard as
   they'd see it, READ-ONLY. Reads run under the admin's session (admin RLS can read
   listings, enquiries, quotes, bookings, invoices, reviews); every write is neutered
   so a preview can never change the tradie's data. */
async function isAdmin(){
 try{const {data:{user}}=await sb.auth.getUser();if(!user)return false;
  const {data}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();
  return !!(data&&data.role==='admin');}catch(e){return false;}
}
// A chainable no-op: any method returns another no-op; awaiting resolves to {data:null,error:null}.
function roNoop(){const p=Promise.resolve({data:null,error:null});
 const h={get:(_t,k)=>k==='then'?p.then.bind(p):k==='catch'?p.catch.bind(p):k==='finally'?p.finally.bind(p):()=>new Proxy({},h)};
 return new Proxy({},h);}
function installReadOnly(){
 const from0=sb.from.bind(sb);
 sb.from=(t)=>{const q=from0(t);['insert','update','upsert','delete'].forEach(m=>{q[m]=()=>roNoop();});return q;};
 const store0=sb.storage.from.bind(sb.storage);
 sb.storage.from=(b)=>{const s=store0(b);s.upload=()=>Promise.resolve({data:null,error:{message:'Preview is read-only'}});s.remove=()=>Promise.resolve({data:null,error:null});return s;};
 sb.rpc=()=>Promise.resolve({data:null,error:{message:'Preview is read-only'}});
 if(sb.functions)sb.functions.invoke=()=>Promise.resolve({data:null,error:null});
}
function showPreviewBanner(name){
 if($('pvBanner'))return;
 document.body.classList.add('preview');
 const b=document.createElement('div');b.id='pvBanner';b.className='pvbar';
 b.innerHTML='<span class="tag">ADMIN PREVIEW</span><span style="color:rgba(255,255,255,.8)">Viewing <b style="color:#fff">'+esc(name||'this tradie')+'</b>, read-only</span><button onclick="location.replace(\'/admin\')">Back to admin</button>';
 document.body.insertBefore(b,$('app'));
}
async function enterPreview(listingId){
 PREVIEW=true;installReadOnly();
 const {data:list}=await sb.from('listings').select('*').eq('id',listingId).limit(1);
 $('gate').style.display='none';$('app').classList.add('on');
 if(!list||!list.length){$('main').innerHTML='<h2>Preview</h2><div class="card empty">Listing not found, or not readable.</div>';return;}
 LST=list[0];ME={id:LST.auth_user_id,email:LST.email||''};
 paintWho();$('w-email').textContent=(LST.email||'')+' · preview';
 // two-factor and billing are the admin's own, not the tradie's: hidden in a preview
 document.querySelectorAll('.nv[data-p="security"],.nv[data-p="billing"],.uc-acts').forEach(n=>n.style.display='none');
 showPreviewBanner(LST.name);
 try{loadCounts();}catch(e){}
 go('home');
}
// boot: resume a session if there is one
(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session){
  const pv=new URLSearchParams(location.search).get('preview');
  if(pv&&await isAdmin()){enterPreview(pv);return;}
  if(await adminRedirect())return;
  if(await mfaRequired()){$('gate').style.display='';$('app').classList.remove('on');showMfaChallenge();return;}
  route();
}})();
