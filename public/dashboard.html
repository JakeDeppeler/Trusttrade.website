<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TrustTrade — Tradie Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F4F4F6;--panel:#fff;--line:#E4E5E9;--line2:#EEEFF2;--ink:#14161B;--ink2:#3A3D45;--mut:#83868F;--gold:#F2A222;--goldd:#B5740F;--goldb:rgba(242,162,34,.14);--green:#1FA463;--greenb:#E7F6EE;--red:#E0483A;--redb:#FCEBEA;--amber:#C57A12;--amberb:#FBF0DC;--blue:#3A6FF0;--blueb:#EAF0FE;--f:'Inter',-apple-system,system-ui,sans-serif;--sh:0 1px 2px rgba(20,22,30,.04),0 6px 18px rgba(20,22,30,.06)}
html[data-theme="dark"]{--bg:#0E0F13;--panel:#17181D;--line:#282A31;--line2:#212228;--ink:#EDEEF2;--ink2:#AEB0BA;--mut:#7E808A;--goldd:#F5BE68;--goldb:#2C2411;--greenb:#12231A;--redb:#2C1615;--amberb:#251C0D;--blueb:#141C2E;--sh:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
/* login */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);width:100%;max-width:400px;padding:30px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FFCB63,#F2A222);display:grid;place-items:center;color:#231700}
.brand b{font-size:17px;font-weight:750}.brand span{display:block;font-size:11px;color:var(--mut);font-weight:600}
.lcard label{display:block;font-size:12px;font-weight:650;color:var(--mut);margin:14px 0 5px}
.lcard input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:var(--bg);color:var(--ink)}
.lcard input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--goldb)}
.err{background:var(--redb);color:#9a2b22;padding:10px 13px;border-radius:10px;font-size:13px;margin-top:12px}
html[data-theme="dark"] .err{color:#FF9B93}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;background:var(--ink);color:var(--panel);font-size:13px;font-weight:650;border:0;cursor:pointer}
.btn.gold{background:var(--gold);color:#231700;width:100%;height:44px;font-size:15px;margin-top:20px}
.btn.w{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.g{background:var(--green);color:#fff}.btn.r{background:var(--redb);color:var(--red);border:1px solid rgba(224,72,58,.25)}
/* app */
.app{display:none;min-height:100vh}.app.on{display:flex}
.side{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.side .who{margin-top:6px;padding:12px;border-radius:13px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px}
.side .who b{font-size:13.5px;display:block}.side .who span{font-size:11.5px;color:var(--mut)}
.nv{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;color:var(--ink2);cursor:pointer;font-weight:550;font-size:14.5px;margin-bottom:2px}
.nv:hover{background:var(--bg)}.nv.on{background:var(--goldb);color:var(--goldd);font-weight:700}
.nv .ct{margin-left:auto;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink2)}
.nv .ct.hot{background:var(--redb);color:var(--red)}
.slbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:16px 12px 6px}
.me{margin-top:auto;padding-top:12px;border-top:1px solid var(--line2);font-size:12px;color:var(--mut)}
.me a{color:var(--red);cursor:pointer;font-weight:650;text-decoration:none}
main{flex:1;padding:28px 32px 64px;max-width:1080px}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.subt{color:var(--mut);font-size:13.5px;margin:5px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px 17px;box-shadow:var(--sh)}
.kpi .k{font-size:10.5px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:27px;font-weight:800;letter-spacing:-.04em;margin-top:8px}
.kpi .d{font-size:11.5px;color:var(--mut);margin-top:5px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.ch{padding:15px 18px;border-bottom:1px solid var(--line2);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:11px 18px;border-bottom:1px solid var(--line2)}
td{padding:13px 18px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.g{background:var(--greenb);color:var(--green)}.pill.r{background:var(--redb);color:var(--red)}.pill.a{background:var(--amberb);color:var(--amber)}.pill.n{background:var(--line2);color:var(--ink2)}.pill.b{background:var(--blueb);color:var(--blue)}
.mut{color:var(--mut)}.mono{font-variant-numeric:tabular-nums}.right{text-align:right}
.empty{padding:26px 18px;color:var(--mut);font-size:13.5px;text-align:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs div{padding:11px 15px;font-size:13.5px;font-weight:650;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs div.on{color:var(--ink);border-bottom-color:var(--gold)}
.fld{display:block;margin-bottom:12px}.fld label{font-size:11px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--bg);color:var(--ink)}
.fld textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banner{background:linear-gradient(135deg,var(--goldb),transparent);border:1px solid var(--gold);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14161B;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.bub{max-width:74%;padding:9px 13px;border-radius:15px;font-size:13px;line-height:1.45;margin:5px 0}
.bub.them{background:var(--line2)}.bub.me{margin-left:auto;background:var(--goldb)}
@media(max-width:820px){.side{width:64px}.side .who,.nv span.lbl{display:none}main{padding:18px}}
/* ===== design refresh (v1) — matches the admin console ===== */
:root{--r:16px;--sh:0 1px 2px rgba(20,22,30,.05),0 10px 26px -14px rgba(20,22,30,.14)}
main{padding:30px 38px 76px}
h1{font-size:25px;letter-spacing:-.035em}
.subt{margin:6px 0 22px}
.card{border-radius:var(--r);box-shadow:var(--sh)}
.ch{padding:16px 20px;font-weight:700;font-size:14.5px}
th{padding:12px 20px}
td{padding:14px 20px}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--line2)}
.kpi{border-radius:var(--r);padding:18px;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(20,22,30,.07),0 22px 46px -20px rgba(20,22,30,.26)}
html[data-theme="dark"] .kpi:hover{box-shadow:0 2px 6px rgba(0,0,0,.5),0 22px 46px -18px rgba(0,0,0,.55)}
.kpi b{font-size:30px}
.kpis{gap:14px;margin-bottom:20px}
.btn{border-radius:10px}
.pill{padding:4px 10px;font-weight:700}
.nv{border-radius:10px}
.nv.on{position:relative}
.nv.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 4px 4px 0;background:var(--gold)}
@media(max-width:820px){main{padding:18px}}
</style></head>
<body>
<!-- LOGIN -->
<div class="gate" id="gate">
 <div class="lcard">
  <div class="brand"><div class="lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#231700" stroke-width="1.8"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg></div><div><b>TrustTrade</b><span>Tradie dashboard</span></div></div>
  <label>Email</label><input id="em" type="email" autocomplete="username" placeholder="you@business.com.au">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
  <div id="e-pw"></div>
  <button class="btn gold" onclick="doPw()">Sign in</button>
  <div class="mut" style="font-size:11.5px;margin-top:14px;text-align:center">Use the same login as the TrustTrade app.</div>
 </div>
</div>
<!-- APP -->
<div class="app" id="app">
 <aside class="side">
  <div class="brand" style="padding:2px 6px 6px"><div class="lg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#231700" stroke-width="1.8"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg></div><div><b style="font-size:15px">TrustTrade</b><span style="font-size:10.5px;color:var(--mut)">Tradie</span></div></div>
  <div class="who"><b id="w-name">—</b><span id="w-sub">—</span></div>
  <div class="nv on" data-p="home" onclick="go('home')"><span class="lbl">Overview</span></div>
  <div class="slbl">Work</div>
  <div class="nv" data-p="leads" onclick="go('leads')"><span class="lbl">Leads</span><span class="ct" id="c-lead">–</span></div>
  <div class="nv" data-p="quotes" onclick="go('quotes')"><span class="lbl">Quotes</span></div>
  <div class="nv" data-p="jobs" onclick="go('jobs')"><span class="lbl">Jobs</span></div>
  <div class="nv" data-p="invoices" onclick="go('invoices')"><span class="lbl">Invoices</span></div>
  <div class="nv" data-p="reviews" onclick="go('reviews')"><span class="lbl">Reviews</span></div>
  <div class="slbl">Your listing</div>
  <div class="nv" data-p="profile" onclick="go('profile')"><span class="lbl">Profile & rates</span></div>
  <div class="nv" data-p="hours" onclick="go('hours')"><span class="lbl">Availability</span></div>
  <div class="nv" data-p="gallery" onclick="go('gallery')"><span class="lbl">Gallery</span></div>
  <div class="slbl">Account</div>
  <div class="nv" data-p="security" onclick="go('security')"><span class="lbl">Security (2FA)</span></div>
  <div class="nv" data-p="billing" onclick="go('billing')"><span class="lbl">Billing</span></div>
  <div class="me"><b id="w-email" style="color:var(--ink);display:block;font-size:12.5px">—</b><span id="w-theme" onclick="toggleTheme()" style="cursor:pointer">Dark mode</span> · <a onclick="signout()">Sign out</a></div>
 </aside>
 <main id="main"></main>
</div>
<script>
const SB_URL='https://pvcblfpxgrznzqgxbujy.supabase.co';
const SB_KEY='sb_publishable_xXxZpIBsumD14mC4zn9qLQ_i4Su8yEN';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>($(id)?$(id).value:'');
function fmtDate(d){if(!d)return '—';const x=new Date(d);return isNaN(x)?'—':x.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});}
function ago(d){if(!d)return '';const s=(Date.now()-new Date(d))/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}
const stars=r=>'★'.repeat(r||0)+'☆'.repeat(5-(r||0));
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function toggleTheme(){const h=document.documentElement,dark=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',dark?'light':'dark');$('w-theme').textContent=dark?'Dark mode':'Light mode';try{localStorage.setItem('tt_td_theme',dark?'light':'dark');}catch(e){}}
try{const t=localStorage.getItem('tt_td_theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}

let ME=null,LST=null,PAGE='home';
const DAYS=['mon','tue','wed','thu','fri','sat','sun'];
function t12(h){const m=/^(\d{1,2}):(\d{2})/.exec(h||'');if(!m)return h||'';let x=+m[1];const ap=x>=12?'PM':'AM';x=x%12||12;return x+':'+m[2]+' '+ap;}
function fmtHours(v){if(v==null)return '—';if(typeof v==='string')return v;if(typeof v==='object'){if(v.closed||v.mode==='closed')return 'Closed';if(v.mode==='emergency')return 'Emergency only';if(v.open&&v.close)return t12(v.open)+' – '+t12(v.close);}return '—';}

async function doPw(){$('e-pw').innerHTML='';
 const {error}=await sb.auth.signInWithPassword({email:val('em').trim(),password:val('pw')});
 if(error){$('e-pw').innerHTML='<div class="err">'+esc(error.message)+'</div>';return;}
 if(await adminRedirect()) return;               // admins run the full admin console
 if(await mfaRequired()){ showMfaChallenge(); return; }
 route();}
// This dashboard is the tradie side. Admins (profiles.role='admin') get sent to
// the admin console, which controls everything and has its own 2FA gate.
async function adminRedirect(){
 try{
  const {data:{user}}=await sb.auth.getUser(); if(!user) return false;
  const {data}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();
  if(data && data.role==='admin'){ location.replace('/admin'); return true; }
 }catch(e){}
 return false;
}
// True when the account has a verified 2FA factor but the session is still aal1.
async function mfaRequired(){
 try{ const {data}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  return !!data && data.nextLevel==='aal2' && data.currentLevel!=='aal2'; }catch(e){ return false; }
}
function showMfaChallenge(){
 const c=document.querySelector('#gate .lcard'); if(!c) return;
 c.innerHTML=`<div class="brand"><div class="lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#231700" stroke-width="1.8"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg></div><div><b>TrustTrade</b><span>Two-factor authentication</span></div></div>
  <label>6-digit code</label><input id="mfa_login" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" onkeydown="if(event.key==='Enter')verifyMfaLogin()">
  <div id="e-mfa"></div>
  <button class="btn gold" onclick="verifyMfaLogin()">Verify</button>
  <div class="mut" style="font-size:11.5px;margin-top:14px;text-align:center">Enter the code from your authenticator app.</div>`;
 const i=$('mfa_login'); if(i) i.focus();
}
async function verifyMfaLogin(){$('e-mfa').innerHTML='';
 const code=(val('mfa_login')||'').replace(/\s/g,'');
 if(code.length<6){$('e-mfa').innerHTML='<div class="err">Enter the 6-digit code</div>';return;}
 try{
  const {data:factors}=await sb.auth.mfa.listFactors();
  const f=(factors&&factors.totp||[])[0]; if(!f){route();return;}
  const {data:ch,error:ce}=await sb.auth.mfa.challenge({factorId:f.id});
  if(ce){$('e-mfa').innerHTML='<div class="err">'+esc(ce.message)+'</div>';return;}
  const {error:ve}=await sb.auth.mfa.verify({factorId:f.id,challengeId:ch.id,code});
  if(ve){$('e-mfa').innerHTML='<div class="err">'+esc(ve.message||'Wrong code, try again')+'</div>';return;}
  route();
 }catch(e){$('e-mfa').innerHTML='<div class="err">'+esc(e.message)+'</div>';}}
async function route(){
 const {data:{user}}=await sb.auth.getUser();ME=user;if(!user)return;
 const {data:list,error}=await sb.from('listings').select('*').eq('auth_user_id',user.id).order('joined_at',{ascending:false}).limit(1);
 $('gate').style.display='none';$('app').classList.add('on');
 $('w-email').textContent=user.email||'';
 if(error||!list||!list.length){noListing(user);return;}
 LST=list[0];
 $('w-name').textContent=LST.name||'Your business';
 $('w-sub').textContent=(LST.trade||'')+(LST.suburb?' · '+LST.suburb:'');
 loadCounts();go('home');
}
async function noListing(user){
 let app=null;try{const {data}=await sb.from('applications').select('status,business_name,created_at,rejection_reason').eq('auth_user_id',user.id).order('created_at',{ascending:false}).limit(1);app=data&&data[0];}catch(e){}
 $('w-name').textContent=(app&&app.business_name)||user.email;$('w-sub').textContent='No live listing yet';
 $('main').innerHTML=`<h1>Welcome</h1><div class="subt">We couldn't find a live listing on your account yet.</div>
  <div class="card"><div style="padding:22px">${app?`Your application <b>${esc(app.business_name||'')}</b> is <span class="pill ${app.status==='approved'?'g':app.status==='rejected'?'r':'a'}">${esc(app.status||'pending')}</span>.${app.status==='rejected'&&app.rejection_reason?`<div style="margin-top:12px;padding:12px 14px;background:var(--redb);border-radius:10px;font-size:13.5px"><b>What to fix:</b> ${esc(app.rejection_reason)}</div>`:''}${app.status==='pending'?'<div class="mut" style="margin-top:10px;font-size:13px">We usually verify within a couple of business days. You will get a notification when you are live.</div>':''}`:'Once your application is approved and your listing goes live, your dashboard will appear here.'}</div></div>
  <div class="me" style="border:0"><a onclick="signout()">Sign out</a></div>`;
}
async function loadCounts(){
 try{const {count}=await sb.from('enquiries').select('*',{count:'exact',head:true}).eq('listing_id',LST.id).eq('status','new');
  const el=$('c-lead');if(el){el.textContent=count??'–';el.classList.toggle('hot',(count||0)>0);}}catch(e){}
}
function signout(){sb.auth.signOut().then(()=>location.reload());}
function go(p){PAGE=p;document.querySelectorAll('.nv').forEach(n=>n.classList.toggle('on',n.dataset.p===p||(p==='quoteNew'&&n.dataset.p==='leads')));
 // No listing on this account (e.g. admin/founder) → every tradie page needs
 // LST, so show the welcome/no-listing state instead of dereferencing null.
 // Security (2FA) is account-level, not listing-level, so it's always allowed.
 if(!LST && p!=='security'){noListing(ME);return;}
 ({home:pHome,leads:pLeads,quoteNew:pQuoteNew,quotes:pQuotes,jobs:pJobs,invoices:pInvoices,reviews:pReviews,profile:pProfile,hours:pHours,gallery:pGallery,billing:pBilling,security:pSecurity}[p])();}
function loading(t){$('main').innerHTML=`<h1>${t}</h1><div class="subt">Loading…</div>`;}
function errBox(e){return `<div class="card"><div class="empty">Couldn't load — ${esc(e.message||e)}</div></div>`;}

async function pHome(){loading('Overview');try{
 const t=LST;
 const [enq,bk,rev]=await Promise.all([
  sb.from('enquiries').select('id,status,created_at').eq('listing_id',t.id),
  sb.from('bookings').select('id,status').eq('listing_id',t.id),
  sb.from('listing_reviews').select('rating').eq('listing_id',t.id)]);
 const newLeads=(enq.data||[]).filter(e=>e.status==='new').length;
 const done=(bk.data||[]).filter(b=>b.status==='completed').length;
 const live=t.status==='approved';
 $('main').innerHTML=`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h1>${esc(t.name||'Your business')}</h1>${live?'<span class="pill g">Live</span>':t.status==='hidden'?'<span class="pill r">Hidden</span>':'<span class="pill a">'+esc(t.status||'')+'</span>'}${t.insured?'<span class="pill g">Insured</span>':'<span class="pill a">Insurance needed</span>'}</div>
  <div class="subt">${esc(t.trade||'')} · ${esc(t.suburb||'')} ${esc(t.postcode||'')}</div>
  ${newLeads?`<div class="banner"><b>You have ${newLeads} new ${newLeads===1?'lead':'leads'}.</b> <span class="mut">Reply fast — speed wins jobs.</span> <button class="btn gold" style="width:auto;height:34px;margin:8px 0 0" onclick="go('leads')">View leads</button></div>`:''}
  <div class="kpis">
   <div class="kpi"><div class="k">New leads</div><b style="${newLeads?'color:var(--gold)':''}">${newLeads}</b><div class="d">${(enq.data||[]).length} all time</div></div>

let QLINES=[];
function qSum(){let sub=0,gst=0;QLINES.forEach(l=>{const p=parseFloat(String(l[1]).replace(/[^0-9.]/g,''))||0;if(!p)return;if(l[3]){const base=Math.round(p/1.1*100)/100;sub+=base;gst+=(p-base);}else{sub+=p;gst+=p*0.1;}});sub=Math.round(sub*100)/100;gst=Math.round(gst*100)/100;return{sub,gst,tot:Math.round((sub+gst)*100)/100};}
function qRenderLines(){const host=$('qlines');if(!host)return;host.innerHTML=QLINES.map((l,i)=>`<div style="border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:8px"><div style="display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:center"><input placeholder="Description" value="${esc(l[0])}" oninput="QLINES[${i}][0]=this.value"><input placeholder="$ price" inputmode="decimal" value="${esc(l[1])}" oninput="QLINES[${i}][1]=this.value;qTot()"><button class="btn r" style="height:36px" onclick="QLINES.splice(${i},1);qRenderLines();qTot()">✕</button></div><label style="font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;margin-top:7px"><input type="checkbox" ${l[3]?'checked':''} onchange="QLINES[${i}][3]=this.checked;qTot()"> price already includes GST</label></div>`).join('');}
function qAddLine(){QLINES.push(['','','',false]);qRenderLines();}
function qTot(){const t=$('qtot');if(!t)return;const {sub,gst,tot}=qSum();t.innerHTML=`<div style="display:flex;justify-content:space-between;padding:4px 0"><span class="mut">Subtotal (ex GST)</span><b class="mono">$${sub.toFixed(2)}</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span class="mut">GST (10%)</span><b class="mono">$${gst.toFixed(2)}</b></div><div style="display:flex;justify-content:space-between;padding:9px 0 2px;border-top:1px solid var(--line2);font-size:16px"><b>Total inc GST</b><b class="mono">$${tot.toFixed(2)}</b></div>`;}

async function sendQuote(){
 if(!LEAD)return;
 const title=(val('q_title')||'').trim();if(!title){toast('Add a job title');return;}
 const {sub,gst,tot}=qSum();if(tot<=0){toast('Add at least one priced line');return;}
 const startTxt=(val('q_start')||'').trim(),warranty=(val('q_warranty')||'').trim();
 const validDays=parseInt(String(val('q_valid')||'').replace(/[^0-9]/g,''),10)||7;
 const scopeLines=QLINES.filter(l=>String(l[0]).trim()).map(l=>{const p=parseFloat(String(l[1]).replace(/[^0-9.]/g,''))||0;return '• '+String(l[0]).trim()+(p?(' ($'+p.toLocaleString()+(l[3]?' inc GST':'')+')'):'');});
 const terms=[];if(startTxt)terms.push('Can start: '+startTxt);terms.push('Valid '+validDays+' days');if(warranty)terms.push('Warranty: '+warranty);
 const scope=scopeLines.join('\n')+(terms.length?('\n\nTerms — '+terms.join(' · ')):'');
 const {error}=await sb.from('quotes').insert({
  tradie_listing_id:LEAD.listing_id,tradie_auth_user_id:ME.id,enquiry_id:LEAD.id,
  customer_id:LEAD.user_id||null,customer_name:LEAD.from_name||'Customer',customer_email:LEAD.from_email||null,customer_phone:LEAD.from_phone||null,customer_suburb:LEAD.from_town||null,
  quote_number:'Q-'+Date.now().toString(36).toUpperCase(),job_title:title,pricing_mode:'fixed',
  fixed_price:tot,subtotal_ex_gst:sub,gst_amount:gst,total_inc_gst:tot,scope_of_work:scope,
  status:'sent',sent_at:new Date().toISOString(),valid_until:new Date(Date.now()+validDays*864e5).toISOString().slice(0,10)});
 if(error){toast((error.message||'').includes('rate_limit')?"You've sent a lot of quotes recently — try again shortly.":error.message);return;}
 toast('Quote sent — $'+tot.toLocaleString());go('quotes');
}

// ── SECURITY / 2FA (Supabase TOTP MFA) ──────────────────────────────
let MFA_ENROLL=null;
async function pSecurity(){loading('Security');
 let totp=[];
 try{const {data}=await sb.auth.mfa.listFactors();totp=((data&&data.totp)||[]).filter(f=>f.status==='verified');}catch(e){}
 if(totp.length){
  $('main').innerHTML=`<h1>Security</h1><div class="subt">Two-factor authentication keeps your account safe.</div>
   <div class="card"><div style="padding:20px">
    <div style="display:flex;align-items:center;gap:10px"><span class="pill g">2FA is on</span><span class="mut">Authenticator app</span></div>
    <p class="mut" style="font-size:13.5px;margin:12px 0">You'll be asked for a 6-digit code from your authenticator app each time you sign in.</p>
    <button class="btn r" onclick="removeMfa('${totp[0].id}')">Turn off 2FA</button>
   </div></div>`;
  return;
 }
 $('main').innerHTML=`<h1>Security</h1><div class="subt">Add two-factor authentication (2FA) for an extra layer of security.</div>
  <div class="card"><div style="padding:20px">
   <p style="font-size:14px;margin-bottom:6px">Protect your account with a 6-digit code from an authenticator app.</p>
   <p class="mut" style="font-size:13px;margin-bottom:16px">Works with Google Authenticator, Authy, 1Password, Microsoft Authenticator and more.</p>
   <button class="btn gold" style="width:auto;height:40px" onclick="startMfa()">Set up 2FA</button>
  </div></div>`;
}
async function startMfa(){
 try{
  const {data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'TrustTrade '+new Date().toISOString().slice(0,10)});
  if(error){toast(error.message);return;}
  MFA_ENROLL=data;
  const qr=(data.totp&&data.totp.qr_code)||'';
  const img=/^data:/.test(qr)?`<img src="${qr}" alt="2FA QR code" style="width:190px;height:190px">`:(qr.indexOf('<svg')>=0?`<div style="width:190px;height:190px">${qr}</div>`:'');
  $('main').innerHTML=`<h1>Set up 2FA</h1><div class="subt">Scan the QR with your authenticator app, then enter the 6-digit code it shows.</div>
   <div class="card"><div style="padding:22px;text-align:center">
    <div style="display:inline-block;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)">${img||'<div class="mut" style="padding:20px">Use the key below</div>'}</div>
    <div class="mut" style="font-size:12px;margin:14px 0 4px">Can't scan? Enter this key manually:</div>
    <div class="mono" style="font-weight:700;letter-spacing:2px;user-select:all;word-break:break-all">${esc((data.totp&&data.totp.secret)||'')}</div>
    <div style="max-width:220px;margin:20px auto 0"><input id="mfa_code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" onkeydown="if(event.key==='Enter')confirmMfa()" style="text-align:center;font-size:20px;letter-spacing:6px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);width:100%"></div>
    <div id="e-mfaset"></div>
    <button class="btn gold" style="width:auto;height:42px;margin-top:14px" onclick="confirmMfa()">Verify &amp; turn on</button>
    <div><a class="mut" style="cursor:pointer;font-size:13px;display:inline-block;margin-top:12px" onclick="go('security')">Cancel</a></div>
   </div></div>`;
 }catch(e){toast(e.message||'Could not start 2FA setup');}
}
async function confirmMfa(){
 if(!MFA_ENROLL)return;
 const box=$('e-mfaset');if(box)box.innerHTML='';
 const code=(val('mfa_code')||'').replace(/\s/g,'');
 if(code.length<6){if(box)box.innerHTML='<div class="err">Enter the 6-digit code</div>';return;}
 try{
  const {data:ch,error:ce}=await sb.auth.mfa.challenge({factorId:MFA_ENROLL.id});
  if(ce){if(box)box.innerHTML='<div class="err">'+esc(ce.message)+'</div>';return;}
  const {error:ve}=await sb.auth.mfa.verify({factorId:MFA_ENROLL.id,challengeId:ch.id,code});
  if(ve){if(box)box.innerHTML='<div class="err">'+esc(ve.message||'Wrong code, try again')+'</div>';return;}
  MFA_ENROLL=null;toast('2FA is on');go('security');
 }catch(e){if(box)box.innerHTML='<div class="err">'+esc(e.message)+'</div>';}
}
async function removeMfa(id){
 if(!confirm('Turn off 2FA? Your account will no longer ask for a code at sign-in.'))return;
 try{const {error}=await sb.auth.mfa.unenroll({factorId:id});if(error){toast(error.message);return;}toast('2FA turned off');go('security');}catch(e){toast(e.message);}
}

// ===== Admin preview mode =====
// An admin can open /dashboard?preview=<listing_id> to see any tradie's dashboard
// exactly as they'd see it — READ-ONLY. Reads run under the admin's session (admin
// RLS allows reading listings/enquiries/quotes/bookings/invoices/reviews/gallery);
// every write is neutered so a preview can never mutate the tradie's data.
let PREVIEW=false;
async function isAdmin(){
 try{ const {data:{user}}=await sb.auth.getUser(); if(!user) return false;
  const {data}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();
  return !!(data&&data.role==='admin'); }catch(e){ return false; }
}
// A chainable no-op: any method returns another no-op; awaiting resolves to {data:null,error:null}.
function roNoop(){ const p=Promise.resolve({data:null,error:null});
 const h={get:(_t,k)=> k==='then'?p.then.bind(p): k==='catch'?p.catch.bind(p): k==='finally'?p.finally.bind(p): ()=>new Proxy({},h)};
 return new Proxy({},h); }
function installReadOnly(){
 const from0=sb.from.bind(sb);
 sb.from=(t)=>{ const q=from0(t); ['insert','update','upsert','delete'].forEach(m=>{ q[m]=()=>roNoop(); }); return q; };
 const store0=sb.storage.from.bind(sb.storage);
 sb.storage.from=(b)=>{ const s=store0(b); s.upload=()=>Promise.resolve({data:null,error:{message:'Preview is read-only'}}); s.remove=()=>Promise.resolve({data:null,error:null}); return s; };
 sb.rpc=()=>Promise.resolve({data:null,error:null});
 if(sb.functions) sb.functions.invoke=()=>Promise.resolve({data:null,error:null});
}
function showPreviewBanner(name){
 if(document.getElementById('pvBanner')) return;
 const b=document.createElement('div'); b.id='pvBanner';
 b.style.cssText='position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:9px 16px;background:#14161B;color:#fff;font-size:13px;font-weight:600';
 b.innerHTML='<span style="background:#F2A222;color:#231700;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:99px">PREVIEW</span><span>Viewing <b>'+esc(name||'this tradie')+'</b>’s dashboard — read-only.</span><a onclick="location.replace(\'/admin\')" style="margin-left:auto;color:#F5BE68;cursor:pointer;font-weight:700">Back to admin</a>';
 const app=document.getElementById('app'); if(app) app.insertBefore(b, app.firstChild);
}
async function enterPreview(listingId){
 PREVIEW=true; installReadOnly();
 const {data:list}=await sb.from('listings').select('*').eq('id',listingId).limit(1);
 $('gate').style.display='none'; $('app').classList.add('on');
 if(!list||!list.length){ $('main').innerHTML='<h1>Preview</h1><div class="card"><div class="empty">Listing not found, or not readable.</div></div>'; return; }
 LST=list[0]; ME={id:LST.auth_user_id, email:LST.email||''};
 $('w-name').textContent=LST.name||'Business';
 $('w-sub').textContent=(LST.trade||'')+(LST.suburb?' · '+LST.suburb:'');
 const we=$('w-email'); if(we) we.textContent=(LST.email||'')+' · preview';
 // 2FA/billing are the admin's own, not the tradie's — hide them in a preview.
 document.querySelectorAll('.nv[data-p="security"],.nv[data-p="billing"]').forEach(n=>n.style.display='none');
 showPreviewBanner(LST.name);
 try{loadCounts();}catch(e){}
 go('home');
}
// boot: resume session if present
(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session){
  const pv=new URLSearchParams(location.search).get('preview');
  if(pv && await isAdmin()){ enterPreview(pv); return; }
  if(await adminRedirect()) return;
  if(await mfaRequired()){ $('gate').style.display=''; $('app').classList.remove('on'); showMfaChallenge(); return; }
  route();
}})();
</script>
